aid: tifin
name: TIFIN
description: 'TIFIN is a Boulder, Colorado based fintech company founded in 2018 by Dr. Vinay
  Nair that builds AI-driven wealth technology for financial advisors, RIAs, broker-dealers,
  asset managers and insurance firms. Its platforms span TIFIN.AI (an agentic operating
  system consolidating the group''s AI businesses for wealth and asset management workflows),
  TIFIN Wealth (investment proposal, risk-capacity and client-personalization tooling that
  integrates with Fidelity, BNY Pershing, Black Diamond, Salesforce, Wealthbox, Redtail,
  Orion and iRebal), TIFIN AMP/AG for asset-manager distribution intelligence, TIFIN Give
  for charitable giving accounts, TIFIN @Work for workplace financial wellness, and Magnifi,
  an AI investing assistant. TIFIN incubated 55ip (sold to J.P. Morgan) and Paralel, and
  announced a joint venture, TIFIN.AI, with J.P. Morgan Asset Management. The company
  states its AI capabilities are available as APIs that plug into existing wealthtech
  stacks, but publishes no public developer portal, API reference, or machine-readable
  contract; access is gated behind a "Get access" request form.'
